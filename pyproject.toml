[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manicule"
version = "0.1.0"
description = "Self-hosted document search and answers, with citations that resolve."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "manicule contributors" }]
keywords = ["rag", "search", "documents", "citations", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]

# Core carries no implementation dependencies. Every entry here is pure Python with no
# native extensions and no network clients. LanceDB, SQLAlchemy, MLX, litellm, FastAPI and
# friends arrive through the extras below, declared by the tickets that implement them, and
# `tests/test_import_boundary.py` fails the build if any of them leak into an import of
# `manicule`.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "packaging>=24.0",
  "python-dotenv>=1.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
# Implementation stacks. Each is owned by the ticket that builds it; they are declared here
# (empty until then) so that the boundary between core and implementations is visible in one
# place rather than discovered by accident.
storage = [        # #2
  "sqlalchemy[asyncio]>=2.0.51",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "lancedb>=0.17",
  "pyarrow>=18.0",
]
embeddings = [     # #3
  # Pooling happens in our own numpy, from token states the backend hands back, because a
  # backend's convenience output is not reliably the model's own pooling. docs/embeddings.md §4.
  "numpy>=2.0",
  # We tokenize rather than letting the backend do it: the embedding call does not surface
  # attention masks, and mean pooling without a mask averages in the padding. `tokenizers` is
  # the Rust implementation on its own, so this does not drag in a training framework.
  "tokenizers>=0.20",
  "huggingface-hub>=0.26",
  # The parity backend, and the only one off Apple Silicon. MIT.
  "onnxruntime>=1.20",
  # GPL-3.0, which is ordinary now that manicule is GPL-3.0-or-later (docs/embeddings.md §1.1),
  # and Apple-only by construction. Marked rather than left to fail at install time on Linux,
  # where CI runs.
  "mlx-embeddings>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
ingest = [         # #5
  # Both are optional on purpose, and neither changes what gets indexed. `psutil` reads a
  # worker's resident memory; without it the same reading costs a fork of `ps` per poll.
  # `watchfiles` backs directory watching; without it, sync still works and only `watch` is
  # unavailable. A dependency that changed a document's *content* would not be optional.
  "watchfiles>=0.24",
  "psutil>=6.0",
]
parsers = [
  # Every one of these is permissively licensed; docs/parsing.md §12 records the rejections
  # (PyMuPDF, extract-msg) and why a copyleft dependency is refused at selection time.
  "pypdfium2>=4.30",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  "selectolax>=0.3.21",
  "python-docx>=1.1",
  "python-calamine>=0.2",
  "python-pptx>=1.0",
  "nbformat>=5.10",
  "markdown-it-py>=3.0",
  "ruamel.yaml>=0.18",
  "tiktoken>=0.8",
]
retrieval = [      # #6
  # Context fitting only. It is a stand-in for the generator's tokenizer, not a claim to be
  # one — the generator runs a Llama, Qwen or Mistral vocabulary and none of them is
  # tiktoken's — but it is a real BPE implementation rather than a character heuristic, and
  # the estimate is calibrated against the generator's own prompt_eval_count once one exists.
  "tiktoken>=0.8",
]
rerank = [         # #6
  # Separate from `retrieval` because it drags in torch, and because the `fast` profile never
  # loads a cross-encoder at all: an installation that only ever runs `fast` should not pay
  # several gigabytes for a model it will not construct.
  "sentence-transformers>=3.0",
]
generation = [     # #7
  # One provider interface. Local and hosted differ by `base_url` and a model prefix, so
  # there is no per-vendor client and no per-vendor type — docs/generation.md §4.1. There is
  # deliberately no Ollama client library here: litellm speaks HTTP, so Ollama is a runtime
  # dependency of one *configuration* rather than an install dependency of manicule.
  #
  # The floor is not decoration. §4.2's `ollama_chat` routing, §4.6's retry gate, §4.8's
  # `BadRequestError` hierarchy and §4.10's usage fallbacks are behaviours verified against
  # this release; lowering it means re-verifying those four rather than merely resolving.
  "litellm>=1.83",
  # The generation-side token estimate (docs/retrieval.md §7.2, generation.md §9.2). Already
  # present under `parsers` for the chunker's provisional counter; declared here too so that
  # installing only the generation extra gets a working estimator.
  "tiktoken>=0.8",
]
connectors = [     # #9
  # One HTTP client, async, with a pluggable transport. The transport seam is why this is the
  # choice: the connector suites run against a synthetic Confluence built on
  # `httpx.MockTransport`, so the traps in docs/connectors/confluence.md §2 are exercised over
  # the same code path a live instance would take rather than against a mocked-out client.
  "httpx>=0.28",
]
serve = [          # #8 — the CLI and the MCP server. #11 — the HTTP API. #12 — the browser UI.
  # Typer derives the command line from type hints, so the signature of a service call and
  # the shape of the command that reaches it cannot drift. MIT.
  "typer>=0.15",
  # Rich renders the tables, progress and diagnostics. MIT.
  "rich>=13.9",
  # FastMCP is decorators over functions: the tool surface is the service surface, with no
  # protocol plumbing of our own to keep in step with the specification. Apache-2.0.
  "fastmcp>=2.10",
  # FastAPI derives the OpenAPI document from the same type hints the routes are written
  # against, so the published schema cannot drift from the handler. Starlette underneath it
  # brings the CORS middleware, the SSE-shaped streaming response and the websocket. MIT.
  "fastapi>=0.115",
  # The ASGI server. `standard` is deliberately not used: it pulls `httptools`, `uvloop` and
  # `watchfiles`, and the bind address here is decided by `manicule.app.bind` rather than by
  # anything uvicorn defaults to. BSD-3-Clause.
  "uvicorn>=0.32",
  # The websocket protocol implementation uvicorn dispatches to. Without it a `ws://` client
  # is refused at the handshake by a server that otherwise looks healthy. BSD-3-Clause.
  "websockets>=13.0",
  # The browser surface's templates. Pure Python, no extension, no build step — which is the
  # whole reason the UI is server-rendered HTML rather than a compiled single-page application:
  # `uv sync` stays the entire install and the container image stays free of a Node toolchain.
  # What is bought is `autoescape`, and on a surface that renders model output over documents
  # somebody else wrote, escaping is the security property rather than a convenience.
  # BSD-3-Clause.
  "jinja2>=3.1",
]

# The built-in parsers and the chunker register the same way a third-party plugin does, through
# the public entry-point group. There is no shorter internal route, so the extension mechanism
# is exercised by every installation rather than only by the people extending it.
[project.entry-points."manicule.plugins"]
parsing = "manicule.parsers.plugin:PLUGIN"
storage = "manicule.storage.plugin:PLUGIN"
embedding = "manicule.embedding.plugin:PLUGIN"
connectors = "manicule.connectors.plugin:PLUGIN"
retrieval = "manicule.retrieval.plugin:PLUGIN"
generation = "manicule.generation.plugin:PLUGIN"

[project.urls]
Homepage = "https://github.com/mgd43b/manicule"
Issues = "https://github.com/mgd43b/manicule/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  # Declared directly, though pytest-cov already brings it, because `[tool.coverage.run] core`
  # is now load-bearing and `pytest-cov>=6.0` does not imply a coverage that has heard of it.
  # coverage warns on an option it does not recognise, and `filterwarnings = ["error"]` turns
  # that into a hard stop — so on too old a release the suite does not run slower, it refuses
  # to run, reporting an unrecognised option rather than anything about the version. The floor
  # is the release the `[tool.coverage.run]` timings below were measured on.
  "coverage>=7.15",
  # What splits the suite across the CI matrix's shards. Chosen over the count-based splitters
  # because this suite's cost is not distributed anything like its test count: the 25 slowest
  # tests are roughly half the run time and nearly all of them are the parser corpus
  # round-trips, so a split that gives each shard an equal *number* of tests gives one of them
  # `test_word.py` and `test_every_parser.py[docx]` together and the sharding buys nothing.
  # `--splits` partitions whatever collection produced rather than a list written down here,
  # which is the property that matters: a test added to a new directory lands in a shard by
  # construction, because an unmeasured test is given the average duration rather than dropped.
  # `.test_durations` therefore only decides *which* shard a test runs in, so a stale one costs
  # balance and cannot cost coverage. It has no configuration file of its own — every option is
  # a flag, and the ones CI passes are in `.github/workflows/ci.yml`.
  "pytest-split>=0.10",
  "ruff>=0.8",
  "pyright>=1.1.390",
  # Fixture generation (docs/parsing.md §3.5): fixtures are built by a checked-in script
  # wherever generation is possible, so their structure is reviewable as code rather than as
  # an opaque binary, and the hostile ones need never be committed at all.
  "reportlab>=4.2",
  "openpyxl>=3.1",
  # Installed so that entry-point discovery is exercised against a real distribution rather
  # than a mock. See packages/manicule-plugin-example.
  "manicule-plugin-example",
  # Parsers that hang, allocate and crash on purpose, so that "one bad document never
  # aborts a batch" is demonstrated rather than asserted. Not published.
  "manicule-plugin-hostile",
  # The parser stack, so `uv sync --all-groups` — what CI runs — can execute the parser
  # suites. Declared as an extra of this project rather than as loose dependencies, so there
  # is one list of what parsing needs and `tests/test_import_boundary.py` still sees them as
  # optional rather than as something an `import manicule` pulls in.
  "manicule[parsers]",
  # The embedding stack, for the same reason: `uv sync --all-groups` has to be able to run the
  # backend parity suite. On Linux this resolves to onnxruntime alone, which is exactly what
  # the parity test's skip logic is written against.
  "manicule[embeddings]",
  # The connector stack, for the same reason: `uv sync --all-groups` is what CI runs, and the
  # Confluence suites need the HTTP client they drive their synthetic instance through.
  "manicule[connectors]",
  # The context fitter's tokenizer, for the same reason. `manicule[rerank]` is deliberately
  # *not* here: it is torch, and the cross-encoder's ordering, truncation and failure rules are
  # exercised through `PairScorer` — a seam that exists so those rules can be tested without a
  # two-gigabyte download. What the extra buys is the model, and a model is not a rule.
  "manicule[retrieval]",
  # The generation stack, for the same reason: `uv sync --all-groups` is what CI runs, and the
  # generation suites drive litellm's own streaming wrapper rather than a mock of it, so the
  # `ollama_chat` routing and the exception hierarchy are exercised against the real library.
  "manicule[generation]",
  # The surfaces, for the same reason: `uv sync --all-groups` is what CI runs, and the CLI and
  # MCP suites drive the real Typer runner and the real FastMCP tool manager rather than mocks
  # of either — which is the only way the "both surfaces are one service" claim is checkable.
  "manicule[serve]",
  # The storage stack. The CLI is the first thing that assembles a whole system from
  # configuration, so its integration suites need the real SQLite store and the real vector
  # store behind the container rather than fakes of both.
  "manicule[storage]",
  # Directory watching, for `manicule index --watch`.
  "manicule[ingest]",
  # What Starlette's test client is written against. It imports `httpx2` under TYPE_CHECKING
  # and falls back to `httpx` at run time with a deprecation warning — and `filterwarnings =
  # ["error"]` turns that warning into a collection failure, while the fallback leaves every
  # `client.get(...)` typed as Unknown under pyright's strict mode. Both symptoms are the same
  # missing package. Test-only: nothing manicule ships imports it, and `httpx` stays the
  # client the connectors use.
  "httpx2>=2.10",
]

# One command. `manicule --help` is the whole surface; `manicule start --mcp-only` is the MCP
# server, which is also reachable as `python -m manicule.mcp` for a client that would rather
# name a module than trust a console script to be on PATH.
[project.scripts]
manicule = "manicule.cli.main:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
manicule = { workspace = true }
manicule-plugin-example = { workspace = true }
manicule-plugin-hostile = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/manicule"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtin shadowing
  "C4",        # comprehensions
  "DTZ",       # naive datetimes
  "T20",       # print
  "PT",        # pytest style
  "RET",       # return
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # pathlib
  "ERA",       # commented-out code
  "PL",        # pylint
  "TRY",       # tryceratops
  "RUF",       # ruff
  "ANN",       # annotations
  "ASYNC",     # async correctness
  "S",         # bandit
  "BLE",       # blind except
  "SLF",       # private member access
  "FIX",       # no TODO/FIXME left behind
  "TD",
]
ignore = [
  "TD002",   # author on TODO — TODOs are banned outright, see FIX
  "TD003",   # issue link on TODO — same
  "TRY003",  # long messages outside exception class: we want readable errors
  "PLR0913", # many arguments: config models legitimately have many fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401", "SLF001"]
"packages/*/tests/**" = ["S101", "PLR2004", "SLF001"]
# A generator script for CAPABILITIES.md. Printing is its output, and it is owned by the
# docs it produces rather than by the application's lint policy.
"tools/**" = ["T201", "PLW2901", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# What the formatter owns, stated **here** rather than in the argument list CI happens to pass.
#
# CI used to check `src tests packages` while the obvious developer command, `ruff format .`,
# also rewrote `tools/` and the Python inside markdown documents. Nothing verified those two, so
# a developer running the natural command introduced changes CI could never fail on — and they
# drifted, which is how this exclusion got written down twice with the second one silently
# undoing the first. With the scope in configuration, `ruff format .` and CI's check are the
# same command over the same set, and cannot disagree.
#
# These are *format-only* exclusions. Both are still linted by `ruff check .`:
#
# * `tools/` is generator scripts owned by the documentation they produce, not by the
#   application's style policy. `[tool.ruff.lint.per-file-ignores]` already treats it that way.
# * The design documents are prose. Their Python is illustrative sketches, hand-aligned into
#   columns — a schema laid out so the types read down the page — and a formatter collapsing
#   that alignment removes the thing the author put there on purpose. They are not code that
#   runs, and no test imports them.
exclude = ["tools/**", "**/*.md"]

[tool.pyright]
include = ["src", "tests", "packages"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
venvPath = "."
venv = ".venv"

# Every parsing library is a binding over a C or Rust extension and none of them ships type
# information: pypdfium2, tree-sitter, selectolax, python-docx, python-pptx, python-calamine.
# Under strict mode that turns each of their calls into an Unknown, and the Unknown spreads
# to every expression downstream of it — thousands of errors that say nothing about this
# code. Only the four rules that report *that* are relaxed, and only under `parsers/`.
# `reportUnknownParameterType`, `reportMissingParameterType` and `reportMissingTypeArgument`
# stay on, so manicule's own signatures are still fully typed; what is permitted is a value
# whose type a third party declined to state. Hand-written stubs for six C extensions were
# the alternative, and a stub that drifts from its library is worse than none, because it
# type-checks confidently against an API that no longer exists.
[[tool.pyright.executionEnvironments]]
root = "src/manicule/parsers"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

# Same relaxation, same reasoning, and deliberately narrower. Four embedding dependencies ship
# no type information or only partial stubs — mlx-embeddings, onnxruntime, tokenizers,
# huggingface-hub — and every call into them yields an Unknown that spreads. Only
# `embedding/runtimes/` is relaxed, and it exists to be the one place they are touched: the
# modules that decide what a vector *is* — embedding/pooling.py, embedding/cards.py,
# embedding/base.py — reach these libraries through the small typed functions there and stay
# fully checked themselves. That split matters more here than for parsers, because
# mlx-embeddings is version 0.1.0 and binds one attribute to different meanings on different
# architectures: a hand-written stub would be confidently wrong rather than merely absent.
# `reportMissingImports` is off for the same directory and a different reason: MLX installs on
# Apple Silicon and nowhere else, so on Linux — where CI type-checks — `import mlx.core` cannot
# resolve at all. That is a narrow real loss, covered by running the code rather than checking
# it: the plugin factory imports these modules and tests/test_embedding_backends.py builds and
# runs both backends. `manicule.embedding.runtimes.mlx_core` exists so that this suppression can
# stay inside this directory instead of following MLX into every caller.
# The same relaxation once more, for the one directory that touches a cross-encoder runtime.
# `sentence-transformers` and torch ship partial type information at best, and the extra is
# deliberately absent from the dev group — CI type-checks without it installed, so
# `reportMissingImports` cannot resolve the import at all. That is a narrow, deliberate loss
# covered by running the code rather than by checking it: `manicule.retrieval.rerank` holds the
# ordering, truncation and failure rules and stays fully checked, because it reaches a runtime
# only through `PairScorer`.
[[tool.pyright.executionEnvironments]]
root = "src/manicule/retrieval/runtimes"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/manicule/embedding/runtimes"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: protocol conformance suites that every implementation must pass",
  "slow: starts real subprocesses; the only way to test what a process boundary buys",
]
filterwarnings = ["error"]

# **Line coverage on `sys.monitoring`, not branch coverage on the C tracer.** Measured on the
# ubuntu runner, four arms of the same suite in one CI run, 3186 tests and 41 skips in every
# arm: no coverage at all took 332s, branch coverage on the C tracer 639s, and *line* coverage
# on the C tracer still took 487s. So the expense is overwhelmingly the tracer rather than the
# branch flag — and on `sys.monitoring` the same measurement is free, at 330s, which is the
# no-coverage arm back within the noise.
#
# The two settings below are one decision rather than two, and cannot be separated on any
# CPython this project supports: `sys.monitoring` cannot measure branches before 3.14, so
# `core = "sysmon"` with `branch = true` is not a slower configuration, it is a refused one.
# coverage emits `CoverageWarning: Can't use core=sysmon`, and `filterwarnings = ["error"]`
# above turns that into a hard error. That is the desirable failure: turning `branch` back on
# stops the suite immediately rather than silently restoring the five minutes.
#
# What is given up is real and worth naming: which way a partially-exercised `if` went. Nothing
# consumes it — there is no `fail_under`, nothing uploads or keeps the report, and `main` has no
# required checks — so it was costing five minutes of every CI run to print a number that was
# read by nobody. If a coverage gate ever arrives and wants branches back, the difference
# between the two arms above — 639s against 330s — is what it costs, and CPython 3.14 removes
# the conflict.
[tool.coverage.run]
source = ["src/manicule"]
core = "sysmon"
branch = false

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.$",
  "raise NotImplementedError",
]
