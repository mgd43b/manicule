[alembic]
script_location = src/manicule/storage/migrations
prepend_sys_path = src
path_separator = os

# Timestamped, so `ls versions/` is chronological and two branches do not produce revisions
# that sort into a misleading order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Overridden at runtime from the data directory. Present so `alembic` is usable by hand
# against a scratch database without editing this file.
sqlalchemy.url = sqlite+aiosqlite:///manicule.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
