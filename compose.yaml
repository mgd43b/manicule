# manicule, containerized: one service, one volume, no published ports.
#
#   docker compose build                                  # ~2.3 GB of model weights, once
#   docker compose run --rm manicule doctor
#   docker compose run --rm manicule index /corpus/docs
#   docker compose run --rm manicule search "how are citations verified"
#
# `/corpus` is this repository, read-only, so the first run has something real to index
# without asking anybody to choose a directory first. Point it somewhere else with
# `MANICULE_CORPUS=~/Documents docker compose run …`.

services:
  manicule:
    build:
      context: .
    image: manicule:local
    # `run` rather than `up`: the default command prints help, and the examples above are
    # short-lived commands. `init: true` gives the process a reaper for pid 1 so ^C during
    # a long ingest is not swallowed.
    init: true
    volumes:
      # The data directory: the database, the LanceDB vector index (the default — absent under
      # storage.vector_db = "qdrant", see the profiled service below), and — because ingest
      # retains source bytes — a byte-identical copy of everything indexed. Treat it as the
      # corpus itself. Request logs and rotated backups live here too, under /data/logs.
      # docs/deployment.md §1.
      - manicule-data:/data
      # Read-only, so an indexing run cannot write to what it is reading.
      - ${MANICULE_CORPUS:-.}:/corpus:ro
    environment:
      # `manicule search` needs no model beyond the embedder in the image. `manicule ask`
      # needs a generator, and this is the one line that points the container at an Ollama
      # running on the host. Without one, `ask` fails with a connection error and everything
      # else is unaffected.
      MANICULE_LLM__BASE_URL: ${MANICULE_LLM_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Docker Desktop resolves this name already; on a Linux daemon it does not exist unless
      # it is mapped, and an unresolvable host is a worse error message than a refused one.
      - "host.docker.internal:host-gateway"
    security_opt:
      # Nothing in manicule needs to gain privileges, and a container that cannot is one fewer
      # thing to reason about if a parser is ever handed a hostile document.
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Deliberately no `ports:`. The default command prints help; serving MCP with
    # `--transport stdio` opens no socket. HTTP mode serves the API; publishing that is an
    # operator's decision: docs/deployment.md §4 says what it costs, and manicule
    # refuses a non-loopback bind unless authentication is on or `--no-authentication` is in
    # the command that started it — never because of anything written in a file.

  # A local Qdrant, for trying `storage.vector_db = "qdrant"` without a server already running
  # somewhere else. Gated behind a compose profile rather than added to the default service
  # list, so it changes nothing about `docker compose run --rm manicule ...` above: a profiled
  # service is neither built nor started unless its profile is named. docs/deployment.md §6.5
  # has the settings; this is a server to point them at.
  #
  #   docker compose --profile qdrant up -d qdrant
  #   docker compose --profile qdrant run --rm \
  #     -e MANICULE_STORAGE__VECTOR_DB=qdrant \
  #     -e MANICULE_STORAGE__VECTOR_DB_URL=http://qdrant:6333 \
  #     manicule doctor
  #
  # `qdrant:6333` rather than `localhost`: the two services share this compose network and
  # reach each other by service name, the same reason `host.docker.internal` stands in for the
  # host's own Ollama above. No `ports:` published here either — add one yourself to reach this
  # Qdrant from outside the compose network.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: ["qdrant"]
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  manicule-data:
  qdrant-data:
