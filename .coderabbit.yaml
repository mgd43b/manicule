# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit does not review pull requests automatically. Reviews here come from
# /code-review; comment `@coderabbitai review` on a PR to request one anyway.
reviews:
  auto_review:
    enabled: false
  review_status: false
  high_level_summary: false
  poem: false
