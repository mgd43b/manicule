# TEMPORARY. A single probe: does pytest-xdist work on this suite at all? This project has a
# documented history of native crashes (`src/manicule/parsers/sourcecode.py` on tree-sitter
# `Point` objects, `src/manicule/testing/contracts.py` on async-generator finalisation), and
# xdist is process-parallel, so the question is whether it survives rather than whether it is
# fast. `filterwarnings = ["error"]` and `asyncio_mode = "auto"` are both in play too.
#
# Deleted before this branch merges either way. A single green run would not be grounds for
# shipping process parallelism against an intermittent crash.

name: CI experiment (temporary)

on:
  pull_request:

concurrency:
  group: ci-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  xdist:
    name: xdist probe (${{ matrix.dist }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `load` hands out individual tests, `loadfile` keeps a module's tests on one worker.
        # If module-scoped state is what breaks, the two disagree and that is worth knowing.
        dist: ["load", "loadfile"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras --python 3.12
      - run: nproc
      - name: cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed grammars
        run: >-
          uv run --python 3.12 python -c
          "from manicule.parsers import grammars;
          print('fetched:', grammars.prefetch(grammars.DECLARED_LANGUAGES));
          missing = grammars.missing_grammars(grammars.DECLARED_LANGUAGES);
          assert not missing, f'grammars still missing after pre-seed: {missing}'"
      - name: cache tiktoken vocabularies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiktoken
          key: vocabularies-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed tiktoken vocabularies
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --python 3.12 python -c
          "from manicule import vocabularies;
          wanted = vocabularies.required_encodings();
          print('seeded:', vocabularies.prefetch(wanted));
          missing = vocabularies.missing_vocabularies(wanted);
          assert not missing, f'vocabularies still missing after pre-seed: {missing}'"
      - name: pytest -n auto
        env:
          REQUIRE_GRAMMAR_BUNDLE: "1"
          REQUIRE_VOCABULARY_BUNDLE: "1"
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --python 3.12 pytest --cov --cov-report=term-missing
          -n auto --dist ${{ matrix.dist }}
          --durations=25 --junit-xml=junit-xdist-${{ matrix.dist }}.xml
      - name: keep the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xdist-${{ matrix.dist }}
          path: junit-xdist-${{ matrix.dist }}.xml
