name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  # Lint, typecheck and tests are three jobs rather than three steps of one, so a failing
  # typecheck still tells you whether the tests pass. One job would stop at the first
  # failure and hide the rest.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        # `.`, deliberately, and with no path list. What the formatter owns is decided in
        # `[tool.ruff.format] exclude` in pyproject.toml, so this is the same command over the
        # same files as the `ruff format .` a developer runs. A path list here would be a
        # second scope that could disagree with the first, which is what it used to do:
        # `src tests packages` left `tools/` and the Python in markdown documents formatted by
        # the obvious command and verified by nothing. tests/test_ci_format_scope.py holds
        # this to `.`.
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: pyright (strict)
        run: uv run pyright

  # Sharded because this job was the whole run's critical path and nothing else was close: at
  # 6m30s a leg it decided when CI finished, while the next-longest job — `container` — was done
  # in 1m42s. It now finishes in 2m54s, for about 3m45s of extra machine time across the whole
  # matrix — a trade worth making on the one job every push and every pull request waits for,
  # and not worth making on any of the others. The 33s of setup ahead of `pytest` is what makes
  # splitting across runners the cheap option rather than the expensive one: a shard re-pays
  # half a minute, not the several minutes an install-heavy job would.
  #
  # Three, and not more, because two costs do not shard. Setup is 33s per shard however many
  # there are, and `pytest` collects the *whole* suite before deselecting the other groups, so
  # collection and the session fixtures are another 34s that every shard pays in full. Only the
  # ~320s of test time actually divides, which is the curve: 1 shard 6m27s, 2 shards 3m47s,
  # 3 shards 2m54s, 4 shards 2m27s, 5 shards 2m11s. A fourth buys 27s for two more jobs, and
  # the floor under all of it is those 67s plus the single longest test — a 25s parser corpus
  # round-trip — which no number of shards divides.
  #
  # Those are measured on this runner rather than modelled: the two ends are the real 390s
  # unsharded leg and the real 174s three-shard one, and the curve is fitted to them. Worth
  # saying because a laptop does not predict them — collection there costs a few seconds rather
  # than 34, which makes local timings far too optimistic about what another shard would buy.
  #
  # The shard count is written twice — `--splits` below and the `shard:` list — and it has to
  # be: `strategy:` cannot read the `env` context, so there is no one place to put it. That is
  # the dangerous kind of duplication rather than the merely untidy kind, because the two
  # disagreeing is silent in the direction that matters: `--splits 4` against a three-entry
  # matrix runs three quarters of the suite and every job reports green. The other direction is
  # loud — `--group` is bounded by `--splits`, so a surplus entry is a `UsageError` rather than
  # a quiet pass. tests/test_ci_test_sharding.py fails the build for both, because the loud one
  # is still cheaper to find in a test than in a CI log.
  test:
    name: test (${{ matrix.python }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras --python ${{ matrix.python }}
      # tree-sitter grammars are fetched from a release bundle rather than shipped in the
      # wheel, so a fresh runner has none. The code parser's suite skips precisely when a
      # grammar is absent — which is the right behaviour for a developer's machine and the
      # wrong outcome for CI, where it would mean the parser is never exercised and the
      # suite still reports green. Pre-seeding is the same step an operator runs, so this
      # also checks that `prefetch` works on a machine that has never had a grammar.
      - name: cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # The assertion after the fetch is the point of the step, not the fetch: a skipped
      # conformance suite certifies nothing, so if the pre-seed ever silently stops working
      # this fails the job here rather than going green with the code parser never run.
      - name: pre-seed grammars
        run: >-
          uv run --python ${{ matrix.python }} python -c
          "from manicule.parsers import grammars;
          print('fetched:', grammars.prefetch(grammars.DECLARED_LANGUAGES));
          missing = grammars.missing_grammars(grammars.DECLARED_LANGUAGES);
          assert not missing, f'grammars still missing after pre-seed: {missing}'"
      # The offline-bundle suite builds a real bundle out of the cache the step above filled,
      # so it needs those grammars present rather than merely welcome. Without the variable it
      # skips on an empty cache — right on a developer's first checkout, and worthless here,
      # where it would mean the air-gapped install is never exercised and the job still reports
      # green. Deliberately outside the `MANICULE_` namespace: the test environment fixture
      # deletes every variable with that prefix before each test, which has already silently
      # disarmed one switch in this repository.
      # tiktoken ships no vocabularies in its wheel either, and the failure that caused is
      # worse than the grammar one: an install indexes perfectly and then cannot answer a
      # question. Same shape of step for the same reason — the pre-seed is what an operator
      # runs, so running it here checks the operator's path and fills the cache the offline
      # suite builds a bundle out of.
      #
      # `TIKTOKEN_CACHE_DIR` is set per step rather than for the job: `runner` is not one of
      # the contexts a job-level `env:` can read, and a workflow that references it there does
      # not fail a test — it fails to parse. Named at all because tiktoken otherwise caches
      # under the system temporary directory, which on a runner is neither durable nor
      # cacheable, and because naming it is what `docs/deployment.md` tells an operator to do.
      - name: cache tiktoken vocabularies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiktoken
          key: vocabularies-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed tiktoken vocabularies
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --python ${{ matrix.python }} python -c
          "from manicule import vocabularies;
          wanted = vocabularies.required_encodings();
          print('seeded:', vocabularies.prefetch(wanted));
          missing = vocabularies.missing_vocabularies(wanted);
          assert not missing, f'vocabularies still missing after pre-seed: {missing}'"
      # `--durations=25` because the last time this job's ten minutes had to be accounted for,
      # nobody could say where they went without adding the flag and running CI again. It costs
      # nothing and it is the first question anyone asks. The distribution is concentrated: the
      # slowest 1% of tests is a little over half the runtime, and it is the parser corpus
      # round-trips, which are doing real work rather than wasting time. It is now also the
      # thing to read when a shard drifts: these are per-shard durations, and a shard that has
      # become the slow one says so here before anyone has to bisect the split.
      #
      # `--splitting-algorithm least_duration` rather than the default contiguous chunks. Both
      # are duration-aware; the difference is that the default cuts the collection order at
      # duration boundaries, so a single 25s test straddling a cut skews the shard it lands in,
      # while `least_duration` packs largest-first into the emptiest shard and is what actually
      # minimises the slowest one — and the slowest shard is the wall clock. It keeps each
      # shard's tests in collection order, so module-scoped fixtures still behave; they are just
      # set up in more than one shard now.
      #
      # **The coverage figure each shard prints is that shard's, not the suite's**, and it will
      # read as a catastrophic drop to anyone who has not been told. It is left in rather than
      # combined because `[tool.coverage.run]` in pyproject.toml already records that nothing
      # consumes this number — no `fail_under`, no upload, no required check — and on
      # `sys.monitoring` it costs nothing to produce. Combining across shards would mean an
      # artifact upload and a fourth job to `coverage combine` them, which is real machinery to
      # make an unread number correct. If it is ever read, that is the moment to build it.
      - name: pytest
        env:
          REQUIRE_GRAMMAR_BUNDLE: "1"
          REQUIRE_VOCABULARY_BUNDLE: "1"
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --python ${{ matrix.python }} pytest
          --splits 3 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --cov --cov-report=term-missing --durations=25

  # A model edited without a migration and a downgrade that has never run both look exactly
  # like a healthy repository. Its own job so a drifted schema is distinguishable from a
  # failing test at a glance. Closes #18.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: alembic check (models match migrations)
        # `check` compares the models against a live database, so one has to exist at head
        # first. The scratch database is created in the runner's working directory and
        # discarded with it.
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: downgrade round trip
        run: uv run pytest tests/test_storage_migrations.py -q

  # The macOS job. Two claims live here, and both are claims that can only be checked on a
  # second platform — which is why they share a runner rather than each having one.
  #
  # **Backend parity.** MLX is Apple Silicon only, so the ubuntu matrix above has one backend
  # and cannot compare two. What is being defended is `EmbedFingerprint` excluding `backend`
  # from identity — the property that lets a corpus move between machines without a re-embed.
  # That exclusion is a claim about numbers, and this job is where the numbers are checked. If
  # it ever goes red, the fix is to move `backend` into IDENTITY_FIELDS, not to widen a
  # tolerance.
  #
  # **Grammars and the offline bundle.** The same shape of claim: the grammar pack resolves its
  # cache through `platformdirs`, which honours `XDG_CACHE_HOME` on Linux and `~/Library/Caches`
  # on macOS, and a bundle is valid for exactly one operating system and architecture. Both are
  # properties that a green ubuntu job says nothing about.
  embeddings:
    name: backend parity (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      # Weights are fetched here rather than by the tests. A test that downloads on first run
      # is a test that fails when the network does, and one that downloads several hundred
      # megabytes per case is a test nobody runs twice.
      - name: cache model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ hashFiles('tools/prefetch_embedding_models.py') }}
      - name: pre-seed models
        run: uv run tools/prefetch_embedding_models.py --mlx
      # The whole point of the job is the assertion, not the fetch. The embedding suites skip
      # what is not downloaded — right on a developer's machine, and worthless here, where a
      # broken pre-seed would leave the parity check unrun and the job green. Naming the model
      # that was seeded turns its skips into failures, and only its own: BAAI/bge-m3 is exercised
      # opportunistically wherever it is already on disk, and is not worth 4.6 GB per CI run.
      #
      # The variable is deliberately not in manicule's `MANICULE_` namespace. The test
      # environment fixture deletes everything in that namespace before each test, so an earlier
      # name for this switch was scrubbed before it was ever read — and the job went green having
      # skipped the parity check entirely.
      #
      # test_embedding_models.py is in the target list for one test in it: the one asserting
      # that this variable survives into a test. Everywhere else it runs with the variable
      # unset, where it passes trivially — here it runs with the variable set, which is the only
      # place the mechanism can actually be shown to be armed. Without that, a green job and a
      # job whose switch was scrubbed again look identical.
      #
      # tests/glossary/test_measured.py is here for the same structural reason and skips for the
      # ordinary one: it measures glossary retrieval against BAAI/bge-m3, which this job does not
      # seed. Naming it keeps the switch *reaching* it, so the day bge-m3 is added to the line
      # above the measurement starts being enforced rather than silently continuing to skip.
      - name: pytest (models required)
        env:
          REQUIRE_EMBEDDING_MODELS: BAAI/bge-small-en-v1.5
        run: >-
          uv run pytest tests/test_embedding_backends.py tests/test_embedding_models.py
          tests/glossary/test_measured.py -q -rs

      # The grammar suites run here too, and macOS is not an arbitrary second platform for
      # them — it is the platform where this exact area has already produced a silent failure.
      # The grammar pack resolves its cache through `platformdirs`, which honours
      # `XDG_CACHE_HOME` on Linux and uses `~/Library/Caches` on macOS, so a cache redirect
      # that looked fine on the ubuntu matrix hid every grammar here and the suite passed by
      # skipping. The offline bundle is also platform-specific by construction — a bundle is
      # valid for one operating system and one architecture — so a bundle that builds, reads
      # and seeds is a claim that has to be checked on each platform separately.
      - name: cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/tree-sitter-language-pack
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed grammars
        run: >-
          uv run python -c
          "from manicule.parsers import grammars;
          print('seeded:', grammars.prefetch(grammars.DECLARED_LANGUAGES));
          missing = grammars.missing_grammars(grammars.DECLARED_LANGUAGES);
          assert not missing, f'grammars still missing after pre-seed: {missing}'"
      - name: pytest (grammar bundle required)
        env:
          REQUIRE_GRAMMAR_BUNDLE: "1"
        run: uv run pytest tests/parsers/test_grammar_bundle.py tests/parsers/test_grammars.py -q -rs

      # The vocabulary suite runs here for the same reason, and the platform difference is
      # concrete rather than theoretical: with nothing configured, tiktoken caches under the
      # system temporary directory, which is `/tmp` on Linux and a per-session directory on
      # macOS. The suite's air-gapped child leaves `TIKTOKEN_CACHE_DIR` unset precisely so
      # that rule is exercised, and a rule only exercised on one platform is a rule checked
      # nowhere.
      - name: cache tiktoken vocabularies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiktoken
          key: vocabularies-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed tiktoken vocabularies
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run python -c
          "from manicule import vocabularies;
          wanted = vocabularies.required_encodings();
          print('seeded:', vocabularies.prefetch(wanted));
          missing = vocabularies.missing_vocabularies(wanted);
          assert not missing, f'vocabularies still missing after pre-seed: {missing}'"
      - name: pytest (vocabulary bundle required)
        env:
          REQUIRE_VOCABULARY_BUNDLE: "1"
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: uv run pytest tests/vocabularies -q -rs

      # The Confluence browser-session store is the macOS Keychain, reached through
      # `/usr/bin/security`, and its tests skip themselves anywhere that command is absent. On
      # the ubuntu matrix that is every one of them, so without this step the tests that hold
      # the most dangerous credential manicule stores would run on a developer's machine and
      # nowhere else. They are here for the same reason the grammar suites are: this is the
      # platform where the behaviour exists, and a suite that passes by skipping is a suite
      # that is not being run.
      #
      # `REQUIRE_KEYCHAIN` turns this suite's Keychain skips into failures, exactly as
      # `REQUIRE_GRAMMAR_BUNDLE` does above and for the same reason: without it a runner with no
      # `/usr/bin/security` would skip the cases and leave the job green, which is
      # indistinguishable from having run them. The whole file is named rather than a
      # keyword-selected subset — the Keychain cases are the reason, and the rest costs seconds.
      - name: pytest (the Keychain is only here)
        env:
          REQUIRE_KEYCHAIN: "1"
        run: uv run pytest tests/connectors/test_browser_sso.py -q -rs

  # The image build, which is also the image's test.
  #
  # The Dockerfile's last stage runs `doctor`, an ingest and a search with `--network=none`,
  # so `docker build` succeeding *is* the assertion that the image needs no network and that
  # its data directory is one only its own account can read. Nothing here re-states those; a
  # second copy of an assertion is a second thing to keep in step.
  #
  # What this job adds is the two checks that can only be made from outside the build: the
  # **shipped** image runs as a non-root account, and the `/data` it carries is `0700`. Both
  # are properties of the final image rather than of any layer, and a `USER` line dropped in a
  # later edit would leave every in-build check passing.
  #
  # Unconditional rather than path-filtered. The build depends on `uv.lock`, the extras in
  # `pyproject.toml`, the grammar bundle tool and every module the smoke test imports, and a
  # filter listing those is a list that goes stale silently — which is the failure this
  # repository keeps having.
  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The grammar pack is staged on the runner and handed to the build, rather than
      # downloaded inside the image. #22 made the *image* need no network; the build still did,
      # on every run, from a third-party GitHub release — so a dropped transfer there blocked
      # every merge in the repository at once, which is what happened. Staging moves that
      # dependency to once per pack release.
      #
      # `--extra parsers` is the only extra involved: this needs `manicule.parsers.grammars`
      # importable and nothing else. The environment lands in `.venv`, which `.dockerignore`
      # excludes, so none of it reaches the build context.
      #
      # Keyed on the pack release *and* the declared language set, because those are the two
      # facts that decide whether a staged directory is usable. The release alone would leave a
      # newly declared language missing from a cache that still hits — and the staging step
      # below refuses to download on a hit, so that would surface as a hard failure rather than
      # a slow build. Platform is in the key because a bundle is valid for one of those.
      #
      # Installed in its own step, as every other job here does, rather than left to the first
      # `uv run`. The next step redirects its output into `$GITHUB_OUTPUT`, so anything uv chose
      # to print on the way past would land in a cache key — and a malformed key is the quietest
      # possible failure of this whole change: the cache stops hitting, the build goes back to
      # downloading the release on every run, and the job stays green.
      - run: uv sync --extra parsers
      - name: what the staged grammars would be valid for
        id: grammars
        run: >-
          uv run --extra parsers python -c
          "import hashlib;
          from manicule.parsers import grammars;
          declared = ','.join(grammars.DECLARED_LANGUAGES);
          print(f'pack={grammars.pack_version()}');
          print(f'languages={hashlib.sha256(declared.encode()).hexdigest()[:12]}')"
          >> "$GITHUB_OUTPUT"
      - name: restore the grammar pack
        id: staged
        uses: actions/cache/restore@v6
        with:
          # The pack's own cache, which is the path the other three jobs here cache and the one
          # an operator would have. Deliberately not the staged directory: with `cache_dir`
          # overridden the pack writes its manifest and the downloaded release tarball *beside*
          # the libraries — 24 MB of them — and caching the staging area would put that in the
          # build context, copied to the daemon on every build. Cached here, reused, and never
          # copied.
          path: ~/.cache/tree-sitter-language-pack
          key: >-
            container-grammars-${{ runner.os }}-${{ runner.arch }}-${{
            steps.grammars.outputs.pack }}-${{ steps.grammars.outputs.languages }}
      # No `restore-keys`. A near-miss here is a directory built for another pack release or
      # another language set, and both are things this must not build an image from — the
      # Dockerfile looks for a directory named after the release it installs, so an older one
      # would be ignored anyway. A prefix match would only make the cache report hits it cannot
      # honour.
      - name: stage the grammar pack the image is built from
        env:
          # On a restored cache nothing should be downloaded, and this is what makes that a
          # demonstrated fact rather than an assumption: the manifest is pointed at the discard
          # port, so a run that reaches for the release fails here instead of quietly fetching
          # it again and reporting the same green tick. It is the same address the suite uses to
          # keep a test honest. Empty on a miss, where fetching is the entire point — read
          # through `or None` below, because an empty string is a URL and `None` is the default.
          TREE_SITTER_LANGUAGE_PACK_MANIFEST_URL: >-
            ${{ steps.staged.outputs.cache-hit == 'true'
            && 'http://127.0.0.1:9/manicule-ci-must-not-download.json' || '' }}
        # The same pre-seed the other two jobs run — the operator's own command, against the
        # pack's default cache — and then a copy of the libraries into a directory named for the
        # release, which is what the Dockerfile looks for. Nothing configures the pack here: the
        # manifest URL above is the only override, and the pack reads that from the environment
        # itself, so a `configure_pack` call would have to pass it back through by hand.
        #
        # The assertion between the two is the point of the step rather than the seed. A staged
        # directory short of a language fails the image build much later, in a builder whose
        # message is about bundles; it fails here instead, naming the language and the pre-seed.
        run: >-
          uv run --extra parsers python -c
          "import shutil;
          from pathlib import Path;
          from manicule.parsers import grammars;
          print('seeded:', grammars.prefetch(grammars.DECLARED_LANGUAGES));
          missing = grammars.missing_grammars(grammars.DECLARED_LANGUAGES);
          assert not missing, f'grammars still missing after the pre-seed: {missing}';
          staged = Path('.ci/grammars') / grammars.pack_version();
          shutil.copytree(grammars.cache_directory(), staged, dirs_exist_ok=True);
          print('staged', len(list(staged.iterdir())), 'libraries in', staged)"
      # Saved only after the step above asserted the set is complete, and only when nothing was
      # restored. `actions/cache` in its combined form saves at the end of the job, which would
      # store whatever the directory held — including a half-finished download from a run that
      # failed. Splitting restore from save is what makes a cached directory one that a build
      # has been shown to be able to use.
      - name: keep the grammar pack for the next run
        if: steps.staged.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: >-
            container-grammars-${{ runner.os }}-${{ runner.arch }}-${{
            steps.grammars.outputs.pack }}-${{ steps.grammars.outputs.languages }}
      - name: docker build (the offline smoke test runs inside it)
        run: docker build --progress=plain --tag manicule:ci .
      - name: the shipped image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id manicule:ci -u)
          echo "uid: ${uid}"
          test "${uid}" -ne 0
      - name: the data directory the image ships is 0700
        # Read from the image rather than from the build, because a named volume takes its
        # ownership and mode from exactly this directory the first time it is mounted.
        run: |
          mode=$(docker run --rm --entrypoint stat manicule:ci -c '%a %U' /data)
          echo "/data: ${mode}"
          test "${mode}" = "700 manicule"

  # Runs on every pull request, including ones that touch no Python at all. The repository
  # is mostly cross-referenced design documents, and a heading renumbered in one file
  # silently invalidates every inbound reference to it. Nothing else catches that.
  docs:
    name: docs links
    runs-on: ubuntu-latest
    env:
      # Pinned here rather than left to `lychee-action`'s default, for two reasons. It is the
      # cache key below, and a floating version cannot be one. And a checker that changes under
      # this repository without a diff is a checker whose results change without a reason.
      LYCHEE_VERSION: v0.24.2
    steps:
      - uses: actions/checkout@v7
      # `lycheeverse/lychee-action@v2` is not used, and the reason is one line of it:
      # `curl -sfLO "${DOWNLOAD_URL}"`, with no retry and no cache, run on every job. That is
      # the same fragility #85 removed from the image build, and it failed this job three times
      # in an hour — `exit 22` (HTTP >= 400) and `exit 56` (failure receiving data), two symptoms
      # of one cause. The action always downloads, so there is no way to put a cache in front of
      # it while still using it; the install below is its install with the two flaws removed.
      - name: restore the link checker
        id: lychee
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/lychee
          key: lychee-${{ runner.os }}-${{ runner.arch }}-${{ env.LYCHEE_VERSION }}
      - name: install the link checker
        if: steps.lychee.outputs.cache-hit != 'true'
        # `--retry-all-errors` is the load-bearing flag and not a belt-and-braces one. Measured:
        # plain `--retry` retries an HTTP 503 and does **not** retry a transfer that drops
        # mid-body — it gives up and leaves a truncated file — so a retry written against the
        # first symptom would not have survived the second, and both have been seen here.
        #
        # `--speed-limit/--speed-time` are what make a stall cheap. Also measured: with only
        # `--max-time` in force, a dropped transfer was not noticed for the full five minutes,
        # which across five retries is twenty-five minutes of a job doing nothing. Aborting a
        # transfer that has managed under 1 KB/s for 30s turns that into 33 seconds and a retry.
        #
        # Downloaded and extracted in a temporary directory, and only an extracted binary is
        # installed into the cached one. A truncated archive therefore cannot become the cache —
        # the next run would restore it, skip the download, and fail on a corrupt checker.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-$(uname -m)-unknown-linux-gnu.tar.gz"
          echo "downloading ${url}"
          curl --fail --location --silent --show-error \
               --retry 5 --retry-all-errors \
               --connect-timeout 20 --max-time 180 --speed-limit 1024 --speed-time 30 \
               --output "${work}/lychee.tar.gz" "${url}"
          tar -xzf "${work}/lychee.tar.gz" -C "${work}"
          # `-print -quit` rather than piping into `head -n 1`. Under `pipefail` that pipeline
          # fails whenever `head` closes the pipe while `find` is still writing — a race this
          # archive is small enough to usually win, which is the worst kind: it would pass
          # every time it was tried and fail on some later Tuesday.
          binary="$(find "${work}" -type f -name lychee -print -quit)"
          if [ -z "${binary}" ]; then
            echo "no lychee binary in the ${LYCHEE_VERSION} archive. Did its layout change?" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.cache/lychee"
          install -m 0755 "${binary}" "${HOME}/.cache/lychee/lychee"
      # Saved only after an install that produced a usable binary, and only when nothing was
      # restored — the same split as the grammar pack, for the same reason.
      - name: keep the link checker for the next run
        if: steps.lychee.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/lychee
          key: lychee-${{ runner.os }}-${{ runner.arch }}-${{ env.LYCHEE_VERSION }}
      # External links are excluded by --offline: the documents are full of GitHub issue
      # URLs, and a rate-limited fetch must never fail a build. What is checked is what
      # this repository controls — relative paths, and anchors resolving to real headings.
      #
      # The version is asserted before the run rather than trusted, and it covers the restored
      # binary as much as the freshly installed one: a cache is a file from another day, and one
      # that will not execute or reports something else is a checker this job must not use.
      #
      # `--format json --output` alongside `--verbose`, so the log keeps every line a human
      # reads *and* the run leaves an artefact the next step can hold to account. Neither is a
      # substitute for the other: the console cannot be asserted on, and the report is not
      # something anybody scrolls.
      - name: lychee
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cache/lychee:${PATH}"
          version="$(lychee --version | head -n 1 | cut -d ' ' -f 2)"
          echo "lychee ${version}"
          if [ "v${version}" != "${LYCHEE_VERSION}" ]; then
            echo "this job pins ${LYCHEE_VERSION} and the checker on PATH reports v${version}." >&2
            echo "A restored cache is holding a different binary; the key is not distinguishing" >&2
            echo "them. Do not trust a link result produced by a checker nobody chose." >&2
            exit 1
          fi
          lychee --offline --include-fragments --no-progress --verbose \
                 --format json --output lychee-report.json \
                 '**/*.md'
      # **The step that makes this job's green tick mean something.** lychee exits 0 when it
      # checked nothing at all — verified, not assumed: pointed at a glob matching no files it
      # prints one warning among thousands of lines and returns success. A job that only
      # propagates the exit code therefore reports the same result for "every link resolves" and
      # "there were no links", and the second is what a renamed directory leaves behind.
      #
      # `!cancelled()` rather than nothing, so this is the last word in every case that is not a
      # cancellation: a lychee that exited non-zero still gets its broken links named here rather
      # than left in the log, and a lychee that never ran leaves no report, which is a failure.
      # That is the property worth more than the cache — a link check that could not run cannot
      # report success, because success is asserted from an artefact only a real run produces.
      - name: the link check actually checked links
        if: ${{ !cancelled() }}
        run: python3 tools/check_link_report.py lychee-report.json
