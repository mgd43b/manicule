name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  # Lint, typecheck and tests are three jobs rather than three steps of one, so a failing
  # typecheck still tells you whether the tests pass. One job would stop at the first
  # failure and hide the rest.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        # tools/ is excluded from formatting only: it is generator scripts owned by the
        # documentation they produce. It is still linted above.
        run: uv run ruff format --check src tests packages

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: pyright (strict)
        run: uv run pyright

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras --python ${{ matrix.python }}
      # tree-sitter grammars are fetched from a release bundle rather than shipped in the
      # wheel, so a fresh runner has none. The code parser's suite skips precisely when a
      # grammar is absent — which is the right behaviour for a developer's machine and the
      # wrong outcome for CI, where it would mean the parser is never exercised and the
      # suite still reports green. Pre-seeding is the same step an operator runs, so this
      # also checks that `prefetch` works on a machine that has never had a grammar.
      - name: cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # The assertion after the fetch is the point of the step, not the fetch: a skipped
      # conformance suite certifies nothing, so if the pre-seed ever silently stops working
      # this fails the job here rather than going green with the code parser never run.
      - name: pre-seed grammars
        run: >-
          uv run --python ${{ matrix.python }} python -c
          "from manicule.parsers import grammars;
          print('fetched:', grammars.prefetch(grammars.DECLARED_LANGUAGES));
          missing = grammars.missing_grammars(grammars.DECLARED_LANGUAGES);
          assert not missing, f'grammars still missing after pre-seed: {missing}'"
      - name: pytest
        run: uv run --python ${{ matrix.python }} pytest --cov --cov-report=term-missing

  # A model edited without a migration and a downgrade that has never run both look exactly
  # like a healthy repository. Its own job so a drifted schema is distinguishable from a
  # failing test at a glance. Closes #18.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: alembic check (models match migrations)
        # `check` compares the models against a live database, so one has to exist at head
        # first. The scratch database is created in the runner's working directory and
        # discarded with it.
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: downgrade round trip
        run: uv run pytest tests/test_storage_migrations.py -q

  # Its own job, on macOS, because it is the only place the claim can be checked: MLX is Apple
  # Silicon only, so the ubuntu matrix above has one backend and cannot compare two.
  #
  # What is being defended is `EmbedFingerprint` excluding `backend` from identity — the
  # property that lets a corpus move between machines without a re-embed. That exclusion is a
  # claim about numbers, and this job is where the numbers are checked. If it ever goes red,
  # the fix is to move `backend` into IDENTITY_FIELDS, not to widen a tolerance.
  embeddings:
    name: backend parity (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      # Weights are fetched here rather than by the tests. A test that downloads on first run
      # is a test that fails when the network does, and one that downloads several hundred
      # megabytes per case is a test nobody runs twice.
      - name: cache model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ hashFiles('tools/prefetch_embedding_models.py') }}
      - name: pre-seed models
        run: uv run tools/prefetch_embedding_models.py --mlx
      # The whole point of the job is the assertion, not the fetch. The embedding suites skip
      # what is not downloaded — right on a developer's machine, and worthless here, where a
      # broken pre-seed would leave the parity check unrun and the job green. Naming the model
      # that was seeded turns its skips into failures, and only its own: BAAI/bge-m3 is exercised
      # opportunistically wherever it is already on disk, and is not worth 4.6 GB per CI run.
      #
      # The variable is deliberately not in manicule's `MANICULE_` namespace. The test
      # environment fixture deletes everything in that namespace before each test, so an earlier
      # name for this switch was scrubbed before it was ever read — and the job went green having
      # skipped the parity check entirely.
      #
      # test_embedding_models.py is in the target list for one test in it: the one asserting
      # that this variable survives into a test. Everywhere else it runs with the variable
      # unset, where it passes trivially — here it runs with the variable set, which is the only
      # place the mechanism can actually be shown to be armed. Without that, a green job and a
      # job whose switch was scrubbed again look identical.
      - name: pytest (models required)
        env:
          REQUIRE_EMBEDDING_MODELS: BAAI/bge-small-en-v1.5
        run: uv run pytest tests/test_embedding_backends.py tests/test_embedding_models.py -q -rs

  # Runs on every pull request, including ones that touch no Python at all. The repository
  # is mostly cross-referenced design documents, and a heading renumbered in one file
  # silently invalidates every inbound reference to it. Nothing else catches that.
  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --verbose
            '**/*.md'
          fail: true
        # External links are excluded by --offline: the documents are full of GitHub issue
        # URLs, and a rate-limited fetch must never fail a build. What is checked is what
        # this repository controls — relative paths, and anchors resolving to real headings.
