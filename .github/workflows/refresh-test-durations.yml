name: Refresh test durations

# **The shards stay balanced because a runner re-measures them, not because somebody remembers.**
#
# ci.yml splits the Python 3.14 suite across three jobs using the committed `.test_durations`, and
# that file goes stale as tests are added: a test it has never heard of is given the *average*
# duration, so the new, heavy ones are placed as though they were cheap. On 2026-10-15 shard 1
# took 12.4 minutes against 7.2 and 6.6 for the others, and every release waits for the slowest
# shard, so the imbalance was paid in full on each one. CONTRIBUTING.md says to regenerate the file
# "when the shards have visibly drifted", which depends on somebody looking at three job timings
# and acting. Nobody did for a month.
#
# **It measures on a runner, serially, with the same environment CI uses.** A laptop's numbers
# balance the shards well enough in principle — relative cost is what matters — but a laptop is
# also the machine doing other work, and the full serial run is about twenty minutes during which
# every figure it records is contended. The environment below is ci-shard-benchmark.yml's: the same
# `uv sync --all-groups --all-extras`, the same grammar and vocabulary pre-seeding, coverage on. A
# test that is skipped for want of an extra locally is recorded as free, then placed as free in
# CI, where it runs.
#
# **It opens a pull request, because `main` will not take anything else.** The first run of this
# workflow measured for 33 minutes and was then refused: `main` requires a pull request and three
# status checks, and the bot has no bypass. It had been written to push directly, on the strength
# of relock.yml doing so — and nothing here had shown that push to be accepted.
#
# **The pull request is opened with a token from a secret, not `github.token`.** Anything pushed
# or opened with `github.token` starts no workflows, so the three required checks would never run
# and the pull request could never merge without a human nudging it. A personal access token or
# GitHub App token acts as a person for that purpose: CI runs on the branch like any other, and
# auto-merge (below) can finish the job. Setting it up is one-time and is described in
# CONTRIBUTING.md. The workflow checks the token **before** it spends half an hour measuring,
# because a missing secret found afterwards loses the measurement.
#
# **One branch, one pull request.** The work goes to a fixed branch, force-pushed, and a pull
# request is opened only if none is open, so a month nobody merged in does not stack a second one
# on top of the first.
#
# **It commits nothing unless the run passed and the result looks like a measurement.** A failed
# suite is a failed job, not a durations file; and a result that has lost more than a tenth of the
# entries it replaces is a partial collection, which would be committed as though the missing
# tests had no cost. Either way the job fails loudly and the committed file stays as it was. The
# measured file is also uploaded as an artifact whatever happens afterwards, so a failure to
# deliver it does not cost the run.
on:
  schedule:
    # The first of the month, early, when nothing is likely to be merging.
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # Never canceled: a canceled run is twenty minutes spent for nothing, and two runs would commit
  # two measurements of the same tree.
  group: refresh-test-durations
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  refresh:
    name: re-measure .test_durations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Reads only. Everything that writes does so with the secret's token, which is the point.
      contents: read
    env:
      GH_TOKEN: ${{ secrets.DURATIONS_REFRESH_TOKEN }}
    steps:
      - name: check the token before measuring
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::the DURATIONS_REFRESH_TOKEN secret is not set. The refreshed file is delivered as a pull request that has to start CI, and github.token cannot do that. See CONTRIBUTING.md, and set it before running this: the measurement takes about half an hour."
            exit 1
          fi
          # Only that it can see the repository. `permissions.push` here is the holder's *role*,
          # not the token's scope, so it is not asked; whether the token can write is asked of
          # the server by the dry-run push below, which cannot be answered by anything else.
          gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name >/dev/null

      # `ref: main`, for the reason relock.yml gives: the measurement belongs on the current tip.
      # The token is given to checkout so the push below is made with it.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.DURATIONS_REFRESH_TOKEN }}

      - name: check the token can push
        # `--dry-run` still asks the server to advertise the branch for writing, which a token
        # without write scope is refused. Asked now, in seconds, because the alternative is
        # finding out after the half-hour measurement — which is how the first run was lost.
        run: git push --dry-run origin HEAD:refs/heads/chore/refresh-test-durations

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Pinned, as everywhere else: the interpreter that measures is the one that tests.
          python-version: "3.14"

      - run: uv sync --all-groups --all-extras --python 3.14

      - name: cache tree-sitter grammars
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed grammars
        run: >-
          uv run --python 3.14 python -c
          "from manicule.parsers import grammars;
          print('fetched:', grammars.prefetch(grammars.DECLARED_LANGUAGES));
          missing = grammars.missing_grammars(grammars.DECLARED_LANGUAGES);
          assert not missing, f'grammars still missing after pre-seed: {missing}'"
      - name: cache tiktoken vocabularies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiktoken
          key: vocabularies-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: pre-seed tiktoken vocabularies
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --python 3.14 python -c
          "from manicule import vocabularies;
          wanted = vocabularies.required_encodings();
          print('seeded:', vocabularies.prefetch(wanted));
          missing = vocabularies.missing_vocabularies(wanted);
          assert not missing, f'vocabularies still missing after pre-seed: {missing}'"

      - name: keep the file being replaced
        run: cp .test_durations "${RUNNER_TEMP}/durations.before.json"

      - name: measure
        id: measure
        env:
          REQUIRE_GRAMMAR_BUNDLE: "1"
          REQUIRE_VOCABULARY_BUNDLE: "1"
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        # Serial and unsplit: `--store-durations` rewrites `.test_durations` from what it ran, so
        # running a shard would replace the whole file with a third of it. `--clean-durations`
        # drops the entries of tests that no longer exist; without it they stay for ever, and the
        # file only grows.
        run: uv run --python 3.14 pytest --store-durations --clean-durations --cov --durations=10

      # Kept whatever happens next. The measurement is the expensive part, and a rejected push or a
      # refused guard should not make it unrecoverable.
      - name: keep the measurement
        if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-durations
          path: .test_durations
          retention-days: 30

      - name: refuse a result that is not a measurement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          def refuse(message):
              print("::error::" + message)
              sys.exit(1)


          before = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "durations.before.json")))
          after = json.load(open(".test_durations"))
          if not isinstance(after, dict) or not after:
              refuse(".test_durations is empty or not an object after the run")
          if len(after) < 0.9 * len(before):
              refuse(
                  f"the refreshed file has {len(after)} entries against {len(before)} before. "
                  "Tests have not vanished in a month; the collection was partial, and "
                  "committing it would record every missing test as free."
              )
          print(f"{len(before)} entries before, {len(after)} after")
          PY

      - name: open or update the pull request
        run: |
          set -euo pipefail
          if git diff --quiet -- .test_durations; then
            echo "The measurement is identical to the committed file; nothing to propose."
            exit 0
          fi

          branch=chore/refresh-test-durations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${branch}"
          git add .test_durations
          git commit \
            -m 'chore: refresh test shard durations' \
            -m 'Re-measured serially on a runner with the environment ci.yml uses, so the three test shards stay balanced as tests are added.' \
            -m 'See .github/workflows/refresh-test-durations.yml for why this commit exists.'

          # Force, because the branch is this workflow's alone and a month-old proposal that was
          # never merged is exactly what a fresh measurement should replace.
          git push --force origin "${branch}"

          open=$(gh pr list --head "${branch}" --state open --json number --jq 'length')
          if [ "${open}" = "0" ]; then
            gh pr create --base main --head "${branch}" \
              --title 'chore: refresh test shard durations' \
              --body 'Re-measured `.test_durations` serially on a runner with the same environment as ci.yml, so the three test shards stay balanced. Generated by `.github/workflows/refresh-test-durations.yml`; a stale file can only cost shard balance, never a test.'
          else
            echo "A pull request for ${branch} is already open; the force-push updated it."
          fi

          # Best effort: auto-merge is a repository setting this workflow cannot turn on, and a
          # pull request that waits for a human is still a correct outcome.
          gh pr merge "${branch}" --auto --squash \
            || echo "::warning::could not enable auto-merge on ${branch}; merge it once its checks pass."
